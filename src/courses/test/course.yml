---
name: course 1
units:
- name: unit 1
  lessons:
  - name: lesson 1
    modules:
    - name: module 1
      inst:
      - type: info
        txt: "$$x = {-b \\pm \\sqrt{b^2-4ac} \\over 2a}$$"
      - type: info
        txt: |
          ----
          class MyClass {
            public static myValue: string;
              constructor(init: string) {
                this.myValue = init;
              }
          }
          import fs = require(\"fs\");
          module MyModule {
            export interface MyInterface extends Other {
              myProperty: any;
            }
          }
          declare magicNumber number;
          myArray.forEach(() => { }); // fat arrow syntax
          ----
      - type: info
        txt: Sample table html=big.history.timeline.highlight.cosmology
      - type: bool
        txt: 'yes'
        ans: 'yes'
      - type: bool
        txt: 'no'
        ans: 'no'
      - type: bool
        txt: no1
        ans: 'no'
      exercises:
      - type: ma
        txt: Choose A and C.
        o: [A, C, B, D]
        exp: |
          * point 1
          * point 2
          * point 3
        ref: |
          * ref 1
          * ref 2
          * ref 3
        numans: 2
      - type: vocab
        list:
          active: something that is currently in use
          alley: a narrow road between buildings
          award: svg=award
          beat: like win, but requires an object, the team or person who lost, when used in the active voice
          beginner: someone starting to learn a skill
      - type: sort
        txt: sort
        ans: [a, b, c, d]
      - type: imap
        txt: choose blue svg=blue
        img: 'src/courses/test/imap.svg'
        ans: blue
      - type: mc
        txt: Choose the bus.
        o:
        - svg=bus
        - svg=car
        - svg=plane
        - svg=train
      - type: gap
        txt: text (1) text (2) text (3)
        ans: [ans1,ans2_longer,ans3]
      - type: gap
        txt: texta (1) texta (2) texta (3)
        ans: [ans1,ans2,ans3]
      - type: select
        inst: Select the prepositional phrase.
        txt: This is a test of underlining.
        ans: [5, 6]
      - type: mc
        txt: If only we ____ have to learn the periodic table of the elements by tomorrow!
        o: [didn't, don't]
      - type: ema
        txt: Select 2 findings that indicate improvement.
        o: [better, better2, worse, same]
        numans: 2
      - type: bins
        txt: Categorize each item.
        o: [apple, carrot, banana, potato]
        bins: [Fruit, Vegetable]
        ans: [Fruit, Vegetable, Fruit, Vegetable]
      - type: cloze-text
        txt: The client is most likely experiencing (1). Priority action is (2).
        choices:
        - [infection, dehydration]
        - [administer fluids, apply oxygen]
        ans: [infection, administer fluids]
      - type: cloze-table
        txt: For each finding, select the interpretation.
        o: [Fundus firm at umbilicus, Fundus boggy displaced right]
        choices:
        - [Expected, Unexpected]
        - [Expected, Unexpected]
        ans: [Expected, Unexpected]
      - type: matrix-single
        txt: For each action, select the category.
        o: [Prepare for cardioversion, Restrict all oral fluids]
        cols: [Indicated, Contraindicated]
        ans: [Indicated, Contraindicated]
      - type: matrix-multi
        txt: Select all systems each finding may affect.
        o: [Blood pressure 168/112, Hyperreflexia with clonus]
        cols: [Cardiovascular, Neurological]
        ans: [Cardiovascular, Neurological]
      - type: bowtie
        txt: Complete the diagram for this client.
        o: [Sepsis, Hypovolemia]
        bowtieActions: [Obtain blood cultures, Increase IV fluids, Discontinue IV]
        bowtieMonitors: [Serum lactate, Urine output, Deep tendon reflexes]
        ans: [Sepsis, Obtain blood cultures, Increase IV fluids, Serum lactate, Urine output]
      - type: cluster
        txt: Case study — post-op day 1.
        set:
        - type: mc
          txt: Which finding is most concerning?
          o: [Rising temperature, Normal appetite]
          groupContext: 'Vitals: T 38.7C, HR 112, BP 98/58'
          groupTag: Analyze Cues
        - type: ma
          txt: Select 2 priority actions.
          o: [Notify provider, Obtain blood cultures, Discontinue diet, Apply warm blanket]
          numans: 2
          groupTag: Take Actions
  - name: lesson 2
    modules:
    - name: module 2
      exercises:
      - type: mc
        txt: Review lesson — which planet is closest to the Sun?
        o: [Mercury, Venus, Earth, Mars]
        exp: Mercury is the closest planet to the Sun.
      - type: mc
        txt: Review lesson — what is the chemical symbol for water?
        o: [H2O, CO2, NaCl, O2]
        exp: Water is H2O — two hydrogen atoms and one oxygen atom.

